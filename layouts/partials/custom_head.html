<style>
     :root {
          --cover-text-color: #ffffff;
          --cover-title-text-shadow: none;
     }

     /* Title and subtitle on the header image */
     .blog-title,
     .blog-description {
          color: #ffffff !important;
          text-shadow: none !important;
     }

     /* Body text and links */
     body {
          color: #2E3A2F !important;
     }

     a:hover {
          color: #C98A0B !important;
     }

     /* Header buttons on startpage */
     a.btn {
          color: #2E3A2F !important;
          background-color: #E8A317 !important;
     }

     a.btn:hover {
          color: #ffffff !important;
          background-color: #3F6B3A !important;
     }

     /* Scroll menu on startpage */
     a.fn-item.active {
          color: #ffaa00 !important;
     }

     a.fn-item:hover {
          color: #ffcf54 !important;
     }

     /* Content / sections */
     .post-holder {
          background: #F7F3E8 !important;
     }

     .post-holder.odd {
          background: #2F5530 !important;
          color: #ffffff !important;
     }

     /* Footer */
     .site-footer {
          color: #D8E2D0 !important;
          background-color: #234026 !important;
     }
</style>
